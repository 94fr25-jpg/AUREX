name: Build Aurex APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Aurex
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aurex-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: Aurex-debug-apk
          path: Aurex-debug.apk
          if-no-files-found: error
