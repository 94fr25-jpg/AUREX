name: Build Aurex APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar Aurex
        run: npx cap sync android

      - name: Instalar Pillow
        run: python3 -m pip install --upgrade pillow

      - name: Instalar logo Aurex
        run: python3 scripts/install_android_icon.py

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aurex.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurex-APK
          path: Aurex.apk
          if-no-files-found: error
